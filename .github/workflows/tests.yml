name: Tests

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest -q
      - run: python bin/method validate all
